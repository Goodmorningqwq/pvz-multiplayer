<svg width="64" height="156" viewBox="0 -24 64 156" xmlns="http://www.w3.org/2000/svg">
  <!-- Conehead, frame 3 of 4: the shambler frame 3 with a traffic cone and a
       maroon shirt. The viewBox grows 24px both above (room for the cone) and
       below, so the body stays centred under setOrigin(0.5) and lines up
       with a shambler in the same lane. -->
  <g stroke="#22301c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M35 69 L34 86 L32 101" fill="none" stroke="#3f5230" stroke-width="8" />
    <path d="M38 43 L46 54" fill="none" stroke="#5c7a3e" stroke-width="7" />

    <path d="M21 33 L45 33 L46 70 L19 70 Z" fill="#6a4a5a" />
    <path d="M19 61 L28 66 L35 60 L42 66 L46 61 L46 70 L19 70 Z" fill="#563a47" />

    <path d="M29 69 L30 86 L31 101" fill="none" stroke="#5c7a3e" stroke-width="8" />
    <path d="M27 43 L15 49 L6 46" fill="none" stroke="#6b8c4a" stroke-width="7" />

    <circle cx="31" cy="19" r="12.5" fill="#6b8c4a" />
    <circle cx="24" cy="18" r="2.6" fill="#22301c" stroke="none" />
    <path d="M22 27 L32 28" fill="none" stroke="#22301c" stroke-width="2" />

    <!-- Traffic cone: the what tells a conehead apart from a shambler at a glance -->
    <path d="M17 10 L43 10 L28 -17 Z" fill="#f08a24" stroke="#7a3d0c" />
    <path d="M22 1 L37 1 L34 -5 L25 -5 Z" fill="#fff2e1" stroke="none" />
    <rect x="15" y="8" width="30" height="5" rx="1.5" fill="#d9701a" stroke="#7a3d0c" />
  </g>
</svg>
