<svg width="64" height="156" viewBox="0 -24 64 156" xmlns="http://www.w3.org/2000/svg">
  <!-- Conehead, frame 0 of 4: the shambler frame 0 with a traffic cone and a
       maroon shirt. The viewBox grows 24px both above (room for the cone) and
       below, so the body stays centred under setOrigin(0.5) and lines up
       with a shambler in the same lane. -->
  <g stroke="#22301c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Far leg, trailing behind -->
    <path d="M37 71 L42 88 L46 102" fill="none" stroke="#3f5230" stroke-width="8" />
    <!-- Far arm, hanging back -->
    <path d="M38 45 L46 57" fill="none" stroke="#5c7a3e" stroke-width="7" />

    <!-- Torso, tattered shirt -->
    <path d="M20 35 L44 35 L46 72 L18 72 Z" fill="#6a4a5a" />
    <path d="M18 63 L27 68 L34 62 L41 68 L46 63 L46 72 L18 72 Z" fill="#563a47" />

    <!-- Near leg, planted forward -->
    <path d="M27 71 L22 88 L17 102" fill="none" stroke="#5c7a3e" stroke-width="8" />
    <!-- Near arm, reaching forward -->
    <path d="M26 45 L14 50 L6 47" fill="none" stroke="#6b8c4a" stroke-width="7" />

    <!-- Head, tilted forward into the shamble -->
    <circle cx="29" cy="21" r="12.5" fill="#6b8c4a" />
    <!-- Eye and jaw -->
    <circle cx="22" cy="19" r="2.6" fill="#22301c" stroke="none" />
    <path d="M20 28 L30 30" fill="none" stroke="#22301c" stroke-width="2" />

    <!-- Traffic cone: the what tells a conehead apart from a shambler at a glance -->
    <path d="M15 12 L41 12 L26 -15 Z" fill="#f08a24" stroke="#7a3d0c" />
    <path d="M20 3 L35 3 L32 -3 L23 -3 Z" fill="#fff2e1" stroke="none" />
    <rect x="13" y="10" width="30" height="5" rx="1.5" fill="#d9701a" stroke="#7a3d0c" />
  </g>
</svg>
